<!DOCTYPE html>
<html lang = "en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Create Account</title>
	<link rel="stylesheet" href="register.css">
</head>
<body>
	
	<div class="register-card">
		<h4>Create Account</h4>
		<p class="subtitle">Become part of Mbarara University</p>

		<form action="#"method="post">
			<label for="surname">Surname</label>
			<input type="text"id="surname"name="surname"placeholder="Enter surname"required>

			<label for="othername">Other name</label>
			<input type="text"id="othername"name="othername"placeholder="Enter other name"required>
            
            <label for="phone">Phone Number</label>
            <div class="phone-field">
            	<span>+256</span>
            	<input type="tel"id="phone"name="phone"placeholder="7xxxxxxxx"pattern="[0-9]{9}" maxlength="9"required>
            </div>

            <small>Enter 9 digits after +256.</small>

            <label for="email">Email Address</label>
            <input type="email"id="email"name="email"placeholder="eg. name@gmail.com"required>

            <label for="password">Password</label>
            <input type="password" id="password"name="password"placeholder="create password"minlength="8"required>

            <label for="confirm">Confirm Password</label>
            <input type="password"id="confirm"name="confirm"placeholder="repeat your password"minlength="8"required>

            <button type="submit">Create Account</button>
            <a href="index.html"class="close-btn">Close</a>
        </form>

        <p class="login-link">
        	Already have an account?
        	<a href="index.html">Login</a>
        </p>
	</div>
</body>
</html>
